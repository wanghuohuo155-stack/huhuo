<rect x="40" y="279" width="580" height="41" rx="18" fill="#d9f2e0" stroke="#4caf7d" stroke-width="3"/>
<text x="58" y="304" font-size="18" fill="#1e6b43">看到 python 3.11 或更高，OK！</text>
<rect x="40" y="330" width="580" height="66" rx="18" fill="#ffe0e0" stroke="#ef6c6c" stroke-width="3"/>

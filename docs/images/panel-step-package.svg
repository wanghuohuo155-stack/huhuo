<text x="56" y="189" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">python rushi-skill\scripts\rushi-cli.py packa</text>
<text x="56" y="216" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">ge --build D:\rushi-skill\books\mybook --proj</text>
<text x="56" y="243" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">ect D:\rushi-skill --name my-pack --version 0</text>

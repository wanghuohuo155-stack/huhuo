<title>入世使用说明书（日式动漫小人书版）</title>
<style>
  body {
    margin:0; padding:28px;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    color:#33475b;
    background-color:#bfe0ff;
  }
  .bg { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; overflow:hidden; }
  .bg svg { width:100%; height:100%; display:block; }
  h1, .flow, .pages, footer { position:relative; z-index:1; }
  h1 {
    text-align:center; font-size:40px; margin:8px 0 22px 0; color:#123c74;
    text-shadow:0 2px 6px rgba(255,255,255,.85), 0 0 22px rgba(255,255,255,.55);
  }
  .flow { display:block; margin:0 auto 30px auto; max-width:1120px;
           filter:drop-shadow(0 6px 14px rgba(40,80,140,.22)); }
  .pages { max-width:1400px; margin:0 auto; display:flex; flex-wrap:wrap; gap:30px; justify-content:center; }
  .page { flex:0 1 680px; }
  .page svg { width:100%; height:auto; display:block;
               filter:drop-shadow(0 6px 14px rgba(40,80,140,.22)); }
  .copy {
    display:block; margin:10px auto 0 auto; padding:8px 18px;
    font-size:16px; font-family:inherit; cursor:pointer;
    color:#2b4a78; background:#ffffff;
    border:2px solid #8fb9e8; border-radius:12px;
    box-shadow:0 3px 8px rgba(40,80,140,.18);
  }
  .copy:hover { background:#f0f8ff; }
  footer { text-align:center; color:#2b4a78; margin-top:36px; font-size:16px;
            text-shadow:0 1px 4px rgba(255,255,255,.8); }
</style>

<section class="page" id="prep-python"><svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
<rect x="6" y="6" width="648" height="420-12" rx="26" fill="#eaf6ff" stroke="#8fb9e8" stroke-width="5"/>
<rect x="24" y="26" width="612" height="56" rx="16" fill="#ffd166" stroke="#8fb9e8" stroke-width="4"/><text x="40" y="63" font-size="30" font-weight="bold" fill="#2b4a78">准备 1：确认有 Python</text><text x="604" y="66" font-size="38">🐍</text>
<text x="40" y="118" font-size="22" fill="#33475b">Python 是让入世跑起来的引擎。</text>
<text x="40" y="149" font-size="22" fill="#33475b">① 按键盘【Win】键，输入 powershell</text>
<text x="40" y="180" font-size="22" fill="#33475b">，回车</text>
<text x="40" y="211" font-size="22" fill="#33475b">② 在黑框框里输入下面这行，回车</text>
<rect x="40" y="224" width="580" height="45" rx="12" fill="#1f3a5f" stroke="#8fb9e8" stroke-width="3"/>
<text x="56" y="251" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">python --version</text>
<rect x="40" y="279" width="580" height="41" rx="18" fill="#d9f2e0" stroke="#4caf7d" stroke-width="3"/>
<text x="58" y="304" font-size="18" fill="#1e6b43">看到 python 3.11 或更高，OK！</text>
<rect x="40" y="330" width="580" height="66" rx="18" fill="#ffe0e0" stroke="#ef6c6c" stroke-width="3"/>
<text x="58" y="355" font-size="18" fill="#a12424">提示找不到 python，去 python.org 下载并勾</text>
<text x="58" y="380" font-size="18" fill="#a12424">选 Add to PATH</text><button class="copy" data-cmd="python --version">📋 复制命令</button></section>
<section class="page" id="prep-codex"><svg xmlns="http://www.w3.org/2000/svg" width="660" height="494" viewBox="0 0 660 494">
<rect x="6" y="6" width="648" height="494-12" rx="26" fill="#eaf6ff" stroke="#8fb9e8" stroke-width="5"/>
<rect x="24" y="26" width="612" height="56" rx="16" fill="#ffd166" stroke="#8fb9e8" stroke-width="4"/><text x="40" y="63" font-size="30" font-weight="bold" fill="#2b4a78">准备 2：把入世装进 Codex</text><text x="604" y="66" font-size="38">🤖</text>
<text x="40" y="118" font-size="22" fill="#33475b">把整个 rushi-skill 文件夹，放进技能的</text>
<text x="40" y="149" font-size="22" fill="#33475b">家里：</text>
<text x="40" y="180" font-size="22" fill="#33475b">（也可以直接对 Codex 说：帮我安装入世）</text>
<rect x="40" y="193" width="580" height="99" rx="12" fill="#1f3a5f" stroke="#8fb9e8" stroke-width="3"/>
<text x="56" y="220" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">Copy-Item -LiteralPath &#x27;D:\rushi-skill\rushi-</text>
<text x="56" y="247" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">skill&#x27; -Destination &#x27;C:\Users\wangh\.codex-cl</text>
<text x="56" y="274" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">i\skills&#x27; -Recurse -Force</text>
<rect x="40" y="302" width="580" height="66" rx="18" fill="#d9f2e0" stroke="#4caf7d" stroke-width="3"/>
<text x="58" y="327" font-size="18" fill="#1e6b43">skills\rushi-skill\SKILL.md 存在</text>
<text x="58" y="352" font-size="18" fill="#1e6b43">，OK！</text>
<rect x="40" y="378" width="580" height="41" rx="18" fill="#ffe0e0" stroke="#ef6c6c" stroke-width="3"/>
<text x="58" y="403" font-size="18" fill="#a12424">权限被拒绝，让家长或 Codex 帮你执行</text>
<rect x="40" y="429" width="580" height="41" rx="18" fill="#fff3d6" stroke="#e8b84b" stroke-width="3"/>
<text x="58" y="454" font-size="18" fill="#7a5b00">装好后，新开一个 Codex 对话才会生效</text><button class="copy" data-cmd="Copy-Item -LiteralPath &#x27;D:\rushi-skill\rushi-skill&#x27; -Destination &#x27;C:\Users\wangh\.codex-cli\skills&#x27; -Recurse -Force">📋 复制命令</button></section>
<section class="page" id="prep-key"><svg xmlns="http://www.w3.org/2000/svg" width="660" height="515" viewBox="0 0 660 515">
<rect x="6" y="6" width="648" height="515-12" rx="26" fill="#eaf6ff" stroke="#8fb9e8" stroke-width="5"/>
<rect x="24" y="26" width="612" height="56" rx="16" fill="#ffd166" stroke="#8fb9e8" stroke-width="4"/><text x="40" y="63" font-size="30" font-weight="bold" fill="#2b4a78">准备 3：给入世配一把钥匙</text><text x="604" y="66" font-size="38">🗝️</text>
<text x="40" y="118" font-size="22" fill="#33475b">入世要请大模型帮忙，需要一把钥匙。</text>
<text x="40" y="149" font-size="22" fill="#33475b">用 DeepSeek（推荐）就输入这 4 行：</text>
<rect x="40" y="162" width="580" height="126" rx="12" fill="#1f3a5f" stroke="#8fb9e8" stroke-width="3"/>
<text x="56" y="189" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">$env:RUSHI_BASE_URL=&#x27;https://api.deepseek.com</text>
<text x="56" y="216" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">&#x27;; $env:RUSHI_MODEL=&#x27;deepseek-chat&#x27;; $env:RUS</text>
<text x="56" y="243" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">HI_API_KEY_ENV=&#x27;DEEPSEEK_API_KEY&#x27;; $env:RUSHI</text>
<text x="56" y="270" font-size="19" fill="#e8f4ff" font-family="Consolas,monospace">_JSON_MODE=&#x27;1&#x27;</text>
<rect x="40" y="298" width="580" height="41" rx="18" fill="#d9f2e0" stroke="#4caf7d" stroke-width="3"/>
<text x="58" y="323" font-size="18" fill="#1e6b43">没有报错 = 设置成功</text>
<rect x="40" y="349" width="580" height="66" rx="18" fill="#ffe0e0" stroke="#ef6c6c" stroke-width="3"/>
<text x="58" y="374" font-size="18" fill="#a12424">提示找不到 DEEPSEEK_API_KEY，先去 plat</text>
<text x="58" y="399" font-size="18" fill="#a12424">form 申请钥匙并设置</text>
<rect x="40" y="425" width="580" height="66" rx="18" fill="#fff3d6" stroke="#e8b84b" stroke-width="3"/>
<text x="58" y="450" font-size="18" fill="#7a5b00">用 OpenAI 也可以：设 $env:OPENAI_API</text>
<text x="58" y="475" font-size="18" fill="#7a5b00">_KEY=&#x27;你的钥匙&#x27;</text><button class="copy" data-cmd="$env:RUSHI_BASE_URL=&#x27;https://api.deepseek.com&#x27;; $env:RUSHI_MODEL=&#x27;deepseek-chat&#x27;; $env:RUSHI_API_KEY_ENV=&#x27;DEEPSEEK_API_KEY&#x27;; $env:RUSHI_JSON_MODE=&#x27;1&#x27;">📋 复制命令</button></section>
